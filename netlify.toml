[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Map /api/chat to the Netlify serverless function
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# Fallback for Single Page Application client routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
